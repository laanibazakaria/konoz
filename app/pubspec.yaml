name: quiz_islami
description: لعبة مسابقة إسلامية تعليمية للأطفال.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http: ^1.2.0 # faux serveur Supabase dans les tests

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/ui/
    - assets/characters/
  # الخط العربي Tajawal (Google Fonts، رخصة OFL)
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    # Police des titres, ronde et ludique (Google Fonts, licence OFL)
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
